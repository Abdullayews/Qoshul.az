# =====================================================================
# VM1 — Oracle A1 (1 OCPU, 6 GB RAM): Caddy + NestJS backend + Redis
# İstifadə (VM1-də): make vm1-up   (--env-file .env Makefile-dən keçir)
# MƏRHƏLƏ 1 DURUMU: backend imajı hələ yoxdur (stub) — vm1-up ilk dəfə
# m2-dən sonra tam işə düşəcək. Caddy + Redis hissəsi hazırdır.
# Yaddaş büdcəsi: docs/runbook.md §5 (20% idle-reclaim qaydası)
# =====================================================================
name: qoshul-vm1

services:
  caddy:
    # linux/arm64 təsdiqlənib — D-005
    image: caddy:2-alpine
    container_name: qoshul-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN tələb olunur}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL tələb olunur}
    volumes:
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    # m1: imaj yoxdur (stub). m2: lokal build, m10: GHCR-dən (CI multi-arch).
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE tələb olunur}
    container_name: qoshul-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: "--max-old-space-size=1536"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    # linux/arm64 təsdiqlənib — D-004
    image: redis:7-alpine
    container_name: qoshul-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD tələb olunur}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata_vm1:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  caddy_data:
  caddy_config:
  redisdata_vm1:
