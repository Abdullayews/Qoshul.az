# Versiya kataloqu (D-036) — bütün versiyalar burada, 2026-10-30 tarixində
# rəsmi repolardan yoxlanılıb (mənbələr docs/decisions.md D-036):
#   AGP:        dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
#   Kotlin:     repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/maven-metadata.xml
#   Compose BOM: dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml
[versions]
agp = "9.5.0"              # son stable; Compose 1.12 (BOM 2026.09.00) AGP 9.1+ tələb edir
kotlin = "2.4.21"         # son stable
composeBom = "2026.09.00" # son stable BOM
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
junit = "4.13.2"
coroutinesTest = "1.10.2"
desugar = "2.1.5"
profileinstaller = "1.4.1"
robolectric = "4.17"
zxing = "3.5.4"          # YALNIZ test: QR generasiyasının skan oluna bilməsi sübutu (D-041)
maplibreCompose = "0.20.0" # MapLibre Compose — vektor xəritə (D-048); FFI nüvə 0.202610.0

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
maplibre-compose-android = { group = "org.maplibre.compose", name = "maplibre-compose-android", version.ref = "maplibreCompose" }
maplibre-compose-runtime-opengl-android = { group = "org.maplibre.compose", name = "maplibre-compose-runtime-opengl-android", version.ref = "maplibreCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
