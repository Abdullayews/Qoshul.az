# Qoshul.az native build konfiqurasiyası (D-036, D-045)
# Sandbox/CI dostu yaddaş profili: Kotlin kompilyatoru proses daxilində
# (ayrıca daemon yoxdur) — 4 GB RAM mühitləri üçün.
org.gradle.jvmargs=-Xmx1792m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
# Tək modul olduğundan paralel icra praktiki təsirsiz; qeyri-aktiv qalır.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
# Konfiqurasiya keşişi (D-045): AGP 9.5 + KGP 2.4 tam dəstəkləyir;
# təkrar build-lərdə konfiqurasiya fazası ötürülür (CI-də gradle/actions
# keşi .gradle qovluğunu saxlayır → 2-ci build-dən tezləşir).
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
