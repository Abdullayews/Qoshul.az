# Qoshul.az native build konfiqurasiyası (D-036)
# Sandbox/CI dostu yaddaş profili: Kotlin kompilyatoru proses daxilində
# (ayrıca daemon yoxdur) — 4 GB RAM mühitləri üçün.
org.gradle.jvmargs=-Xmx1792m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# Sandbox: tam JDK (javac) buradadır; CI-də setup-java təmin edir
# org.gradle.java.home=/home/z/tools/jdk-21.0.13+9

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
