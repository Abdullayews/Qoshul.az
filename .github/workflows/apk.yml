# Qoshul.az — APK build pipeline (D-017, v0.6.0 genişlənmə)
#
# Bu mərhələdə (m1 sonrası preview):
#   - android/ platform faylları repoda YOXDUR — CI-də `flutter create` generasiya edir
#   - kurasiyalı native qat (D-032: Kotlin MainActivity + Java NativePerfInfo)
#     mobile/platform/android/ qovluğunda saxlanılır və create-dən sonra yerləşdirilir
#   - imza: Flutter şablonunun debug keystore-u (yalnız birbaşa quraşdırma üçün)
#   - Flutter versiyası pin edilməyib (channel: stable) — m8-də pin olunacaq
name: APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apk.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK (v0.6.0 — Real xəritə + native qat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Kodu çıxar
        uses: actions/checkout@v4

      - name: Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android platform faylları (flutter create — D-017)
        run: |
          set -e
          flutter create --platforms=android --org az.qoshul --project-name qoshul .
          # create-in toxuna biləcəyi bizim faylları GERİ qaytar (main.dart, pubspec və s.)
          git checkout -- .
          # Tətbiq adı: "qoshul" -> "Qoshul.az"
          sed -i 's/android:label="qoshul"/android:label="Qoshul.az"/' \
            android/app/src/main/AndroidManifest.xml
          flutter --version

      - name: Kurasiyalı native qat (D-032 — Kotlin + Java)
        # MainActivity.kt (edge-to-edge insets + immersive + MethodChannel) və
        # NativePerfInfo.java (adaptiv keyfiyyət profili) — D-017 create axınına
        # qatı qoyulur; gələcəkdə tam android/ qovluğu repoya keçəndə no-op.
        run: |
          set -e
          cp -r platform/android/app/src/main/kotlin \
             android/app/src/main/kotlin
          mkdir -p android/app/src/main/java
          cp -r platform/android/app/src/main/java/az \
             android/app/src/main/java/

      - name: Asılılıqlar
        run: flutter pub get

      - name: Keyfiyyət qapısı (analyze + test)
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: APK build (release)
        run: flutter build apk --release

      - name: Artifaktı daxil et
        uses: actions/upload-artifact@v4
        with:
          name: qoshul-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # NOTE-1 direktivi: hər versiya YALNIZ action artifaktı kimi deyil,
  # həmçinin GitHub beta (pre-release) release kimi paylaşılır.
  release:
    name: Beta Release (GitHub)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu çıxar (pubspec versiyası üçün)
        uses: actions/checkout@v4

      - name: Versiyanı oxu
        id: ver
        run: |
          V=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Artifaktı endir
        uses: actions/download-artifact@v4
        with:
          name: qoshul-apk
          path: apk

      - name: APK adını dəyiş
        run: mv apk/app-release.apk "apk/Qoshul.az-v${{ steps.ver.outputs.version }}.apk"

      - name: Beta release paylaş (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-beta
          name: Qoshul.az v${{ steps.ver.outputs.version }} (Beta)
          prerelease: true
          generate_release_notes: true
          files: apk/Qoshul.az-v${{ steps.ver.outputs.version }}.apk
          body: |
            Qoshul.az v${{ steps.ver.outputs.version }} — beta test build (UI mərhələsi, mock data).

            **Quraşdırma:** APK-nı endirib birbaşa quraşdırın (debug imza).

            Bu release CI tərəfindən avtomatik yaradılır — hər build artifacts
            səhifəsində də mövcuddur.

  # Vizual QA (v0.7.0): veb build — APK quraşdırmadan brauzerdə yoxlama
  # üçün artifact. UI-first mərhələsində hər versiyanın ekran görüntüləri
  # bu artifact-dən alınır (agent tərəfindən brauzer skrinşotları ilə).
  web:
    name: Web build (vizual QA)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Kodu çıxar
        uses: actions/checkout@v4

      - name: Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Asılılıqlar
        run: flutter pub get

      - name: Web platform faylları (flutter create)
        run: |
          set -e
          flutter create --platforms=web --project-name qoshul .
          git checkout -- .

      - name: Web build (release)
        run: flutter build web --release

      - name: Artifaktı daxil et
        uses: actions/upload-artifact@v4
        with:
          name: qoshul-web
          path: mobile/build/web
          if-no-files-found: error
