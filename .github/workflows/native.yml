# Qoshul.az native (Kotlin + Compose + Rust) CI — D-036/D-040/D-080.
# M1: supabase/ sxem + SQL struktur lint-i.
# M2: rust-core (qoshul-core + qoshul-jni) — fmt/clippy/test + host .so
#     (paritet testləri üçün) + cargo-ndk ilə Android jniLibs.
name: Native

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native.yml"
      - "android-app/**"
      - "supabase/**"
      - "rust-core/**"
      - "scripts/lint_sql.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (Kotlin + Compose) — test + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Kodu çıxar
        uses: actions/checkout@v4

      - name: Rust toolchain (stable, D-080)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust keşi
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Rust fmt + clippy (D-080)
        working-directory: rust-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust testləri (35 — unit + proptest + quircs QR dekod sübutu)
        working-directory: rust-core
        run: cargo test --release

      - name: Host .so (RustParityTest üçün)
        working-directory: rust-core
        run: cargo build --release -p qoshul-jni

      - name: Font AUDİT (M3, D-081 — subset_fonts.py əvəzi)
        working-directory: rust-core
        run: cargo run -p qoshul-fonts -- --root ../android-app

      - name: cargo-ndk + Android .so (arm64-v8a + armeabi-v7a)
        working-directory: rust-core
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # ubuntu-latest SDK quraşdırılıdır (cmdline-tools daxil) — setup-android
          # action-u lazımsız (sdkmanager tools addımı runner-də iflas edir)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;28.2.13676358" > /dev/null 2>&1 \
            || sdkmanager --install "ndk;28.1.13382995" > /dev/null 2>&1 \
            || sdkmanager --install "ndk;27.2.12479018" > /dev/null 2>&1
          ls "$ANDROID_HOME/ndk/" || true
          cargo install --locked cargo-ndk --version 3.5.5
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../android-app/app/src/main/jniLibs build --release -p qoshul-jni
          ls -la ../android-app/app/src/main/jniLibs/*/

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: SQL struktur lint-i (M1, D-076)
        working-directory: .
        run: python3 scripts/lint_sql.py

      - name: Robolectric android-all keşi (D-042)
        # android-all jarları (~130 MB) ~/.m2-də qlobal keşlənir — hər run-da
        # yenidən yüklənməsin; açar = Robolectric versiyası (libs.versions.toml)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-androidall-${{ hashFiles('android-app/gradle/libs.versions.toml') }}
          restore-keys: robolectric-androidall-

      - name: Vahid testlər (JVM — məntiq + QR sübutu + Robolectric UI, D-041/D-042)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Test nəticələri (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: android-app/app/build/test-results/
          if-no-files-found: error

      # D-054: Robolectric NATIVE renderlər — "proqramın üzü" JVM-də
      - name: Ekran görüntüləri (Robolectric, D-054)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoshul-screenshots
          path: |
            android-app/build/shots/
            android-app/app/build/shots/
          if-no-files-found: ignore
          overwrite: true

      - name: Release APK (R8 + resource shrink)
        run: ./gradlew assembleRelease --no-daemon

      - name: APK artifaktı
        uses: actions/upload-artifact@v4
        with:
          name: qoshul-native-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
