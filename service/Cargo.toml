[package]
name = "qoshul-service"
description = "Qoshul.az M4 mikroservisi — axum: FCM HTTP v1, idempotent joblar, admin panel API (D-082)"
version = "0.20.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "qoshul_service"
path = "src/lib.rs"

[[bin]]
name = "qoshul-service"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["full"] }
reqwest = { version = "=0.13.5", features = ["json"] }
serde = { version = "=1.0", features = ["derive"] }
serde_json = "=1.0"
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", features = ["serde"] }

[dev-dependencies]
tower = { version = "=0.5", features = ["util"] }
