name: qoshul
description: Qoshul.az — Azərbaycanda yeni tanışlıqlar, birgə planlar və görüşlər.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.0.0

# UI mərhələsi (D-023): sıfır xarici asılılıq — yalnız Flutter SDK.
# Backend inteqrasiyasında (m8+) http/bloc/paketlər əlavə olunacaq.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
